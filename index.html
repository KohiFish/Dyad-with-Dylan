<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>Grade Menu App</title>
        <style>
            * {
                box-sizing: border-box;
            }
            body {
                background-color: #1e1e1e;
                color: #ffffff;
                font-family: Arial, Helvetica, sans-serif;
                margin: 0;
                display: flex;
                flex-direction: column; 
                height: 100vh;
                overflow: hidden;
                border: 1px solid #333333;
                border-radius: 8px;
            }
            .title-bar {
                -webkit-app-region: drag; 
                width: 100%;
                height: 35px;
                background-color: #2d2d2d;
                display: flex;
                align-items: center;
                padding-left: 15px;
                font-size: 13px;
                font-weight: bold;
                user-select: none;
                flex-shrink: 0;
            }
            .container {
                padding: 24px;
                display: flex;
                flex-direction: column;
                gap: 16px;
                overflow-y: auto;
                flex-grow: 1;
            }
            h2 {
                margin: 0 0 4px 0;
                font-size: 20px;
            }
            p.subtitle {
                margin: 0 0 16px 0;
                color: #aaaaaa;
                font-size: 13px;
            }
            .form-group {
                display: flex;
                flex-direction: column;
                gap: 6px;
                margin-bottom: 14px;
            }
            label {
                font-size: 12px;
                color: #cccccc;
                font-weight: 500;
            }
            input {
                background-color: #2b2b2b;
                border: 1px solid #444444;
                color: #ffffff;
                padding: 10px 12px;
                border-radius: 6px;
                font-size: 14px;
                outline: none;
                width: 100%;
                transition: border-color 0.2s;
            }
            input:focus {
                border-color: #007acc;
            }
            button {
                background-color: #007acc;
                color: white;
                border: none;
                padding: 10px;
                border-radius: 6px;
                font-size: 14px;
                font-weight: 600;
                cursor: pointer;
                margin-top: 8px;
                width: 100%;
                transition: background-color 0.2s;
            }
            button:hover {
                background-color: #005999;
            }
        </style>
    </head>
    <body>
        <div class="title-bar">Grade Menu</div>

        <div class="container" id="login-screen">
            <div>
                <h2>Home Access Center</h2>
                <p class="subtitle">Enter your district portal information</p>
            </div>


            <form id="hac-login-form">
                <div class="form-group">
                    <label for="district-url">District HAC URL</label>
                    <input type="url" id="district-url" placeholder="https://hac.yourdistrict.org" required>
                </div>

                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" placeholder="Student ID" required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="Password" required>
                </div>

                <button type="submit">Connect and view grades</button>
            </form>
        </div>
        

        <script>
            const { ipcRenderer } = require('electron');
            const loginScreen = document.getElementById('login-screen');
            const gradesScreen = document.getElementById('grades-screen');
            const gradesList = document.getElementById('grades-list');
            const loginForm = document.getElementById('hac-login-form');
            const submitBtn = loginForm.querySelector('button[type="submit"]');
            loginForm.addEventListener('submit', async (e) => {
                const districtUrl = document.getElementById('district-url').value;
                const username = document.getElementById('username').value;
                const password = document.getElementById('password').value;
                submitBtn.textContent = "Connecting..."
                submitBtn.disabled = true;
                const result = await ipcRenderer.invoke('scrape-grades', { districtUrl, username, password });
                submitBtn.textContent = 'Connect'
                submitBtn.disabled = false;
                if (result.success) {
                    loginScreen.style.display = 'none';
                    gradesScreen.style.display = 'flex';
                    gradesList.innerHTML = '';
                    if (result.data.length === 0) {
                        gradesList.innerHTML - '<p style="color: #aaaaaa;">No classes found. Please check your page selectors.</p>';
                    } else {
                        result.data.forEach(cls => {
                            const card = document.createElement('div');
                            card.className = 'grade-card';
                            card.textContent = cls.className;
                            gradesList.appendChild(card);
                        });
                    }
                } else {
                    alert('Failed to login: ' + result.error);
                }
            });
            document.getElementById('back-btn').addEventListener('click', () => {
                gradesScreen.style.display = 'none';
                loginScreen.style.display = 'flex';
            });
        </script>
    </body>
</html>
