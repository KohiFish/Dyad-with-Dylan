<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>Grade Menu App</title>
        <style>
            * {
                box-sizing: border-box;
            }
            body {
                background-color: #1e1e1e;
                color: #ffffff;
                font-family: Arial, Helvetica, sans-serif;
                margin: 0;
                display: flex;
                flex-direction: column;
                height: 100vh;
                overflow: hidden;
                border: 1px solid #333333;
                border-radius: 8px;
            }
            .title-bar {
                -webkit-app-region: drag;
                width: 100%;
                height: 35px;
                background-color: #2d2d2d;
                display: flex;
                align-items: center;
                padding-left: 15px;
                font-size: 13px;
                font-weight: bold;
                user-select: none;
                flex-shrink: 0;
            }
            .container {
                padding: 24px;
                display: flex;
                flex-direction: column;
                gap: 16px;
                overflow-y: auto;
                flex-grow: 1;
            }
            h2 {
                margin: 0 0 4px 0;
                font-size: 20px;
            }
            p.subtitle {
                margin: 0 0 16px 0;
                color: #aaaaaa;
                font-size: 13px;
            }
            .form-group {
                display: flex;
                flex-direction: column;
                gap: 6px;
                margin-bottom: 14px;
            }
            label {
                font-size: 12px;
                color: #cccccc;
                font-weight: 500;
            }
            input {
                background-color: #2b2b2b;
                border: 1px solid #444444;
                color: #ffffff;
                padding: 10px 12px;
                border-radius: 6px;
                font-size: 14px;
                outline: none;
                width: 100%;
                transition: border-color 0.2s;
            }
            input:focus {
                border-color: #007acc;
            }
            button {
                background-color: #007acc;
                color: white;
                border: none;
                padding: 10px;
                border-radius: 6px;
                font-size: 14px;
                font-weight: 600;
                cursor: pointer;
                margin-top: 8px;
                width: 100%;
                transition: background-color 0.2s;
            }
            button:hover {
                background-color: #005999;
            }
            button:disabled {
                cursor: not-allowed;
                opacity: 0.7;
            }
            .back-btn {
                width: auto;
                margin: 0 0 16px 0;
                padding: 8px 12px;
            }
            .grades-list {
                display: flex;
                flex-direction: column;
                gap: 10px;
            }
            .grade-card {
                background-color: #2d2d2d;
                border: 1px solid #4a4a4a;
                border-radius: 6px;
                padding: 12px;
                color: #f0f0f0;
            }
            .hidden {
                display: none !important;
            }
        </style>
    </head>
    <body>
        <div class="title-bar">Grade Menu</div>

        <div class="container" id="login-screen">
            <div>
                <h2>Home Access Center</h2>
                <p class="subtitle">Enter your district portal information</p>
            </div>

            <form id="hac-login-form">
                <div class="form-group">
                    <label for="district-url">District HAC URL</label>
                    <input type="url" id="district-url" placeholder="Your school's URL" required>
                </div>

                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" placeholder="Student ID" required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="Password" required>
                </div>

                <button type="submit">Connect and view grades</button>
            </form>
        </div>

        <div class="container hidden" id="grades-screen">
            <button type="button" id="back-btn" class="back-btn">Back</button>
            <div>
                <h2>My Grades</h2>
            </div>
            <div id="grades-list" class="grades-list"></div>
        </div>

        <script>
            const { ipcRenderer } = require('electron');
            const loginScreen = document.getElementById('login-screen');
            const gradesScreen = document.getElementById('grades-screen');
            const gradesList = document.getElementById('grades-list');
            const loginForm = document.getElementById('hac-login-form');
            const backBtn = document.getElementById('back-btn');

            if (!loginScreen || !gradesScreen || !gradesList || !loginForm || !backBtn) {
                throw new Error('Required app elements were not found in the DOM.');
            }

            const submitBtn = loginForm.querySelector('button[type="submit"]');

            if (!submitBtn) {
                throw new Error('Submit button was not found in the login form.');
            }

            loginForm.addEventListener('submit', async (e) => {
                e.preventDefault();

                const districtUrl = document.getElementById('district-url').value.trim();
                const username = document.getElementById('username').value.trim();
                const password = document.getElementById('password').value;

                if (!districtUrl || !username || !password) {
                    alert('Please complete every field before connecting.');
                    return;
                }

                submitBtn.textContent = 'Connecting...';
                submitBtn.disabled = true;

                const result = await ipcRenderer.invoke('scrape-grades', { districtUrl, username, password });

                submitBtn.textContent = 'Connect and view grades';
                submitBtn.disabled = false;

                if (result.success) {
                    loginScreen.classList.add('hidden');
                    gradesScreen.classList.remove('hidden');
                    gradesList.innerHTML = '';

                    if (result.data.length === 0) {
                        gradesList.innerHTML = '<p style="color: #aaaaaa; margin: 0;">No classes found. Please check your page selectors.</p>';
                    } else {
                        result.data.forEach((cls) => {
                            const card = document.createElement('div');
                            card.className = 'grade-card';
                            card.textContent = cls.className;
                            gradesList.appendChild(card);
                        });
                    }
                } else {
                    alert('Failed to login: ' + result.error);
                }
            });

            backBtn.addEventListener('click', () => {
                gradesScreen.classList.add('hidden');
                loginScreen.classList.remove('hidden');
            });
        </script>
    </body>
</html>
